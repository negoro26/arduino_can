[platformio]
; `pio run` builds firmware only; the native env exists purely for `pio test`.
default_envs = mkr1000USB

[env:mkr1000USB]
platform = atmelsam
board = mkr1000USB
framework = arduino
monitor_speed = 115200
; timestamp every line, and tee everything to a log file in the project dir
monitor_filters = default, time, log2file
; Belt-and-braces for hosts that gate native-USB CDC output on DTR. Measured
; on this board: output flows with DTR/RTS deasserted, so this is not required.
monitor_dtr = 1
monitor_rts = 1
lib_deps = autowp/autowp-mcp2515@^1.3.1
; test_diag_rules is a HOST-ONLY suite. Without this line, `pio test` also
; targets this environment: it uploads a Unity runner to the board, blocks
; waiting for results over serial, tells you to put the board in reset mode,
; and hangs anyway. Ignoring it here prevents that.
;
; Consequence to be aware of: default_envs below applies to `pio test` as well
; as `pio run`, so a bare `pio test` resolves to this environment, skips the
; only suite, and reports "0 test cases" with exit 0. That is a vacuous pass --
; ALWAYS run tests as:
;   pio test -e native
test_ignore = *
; Hardware tests are pointless for pure logic and impossible without a car, so
; the decision rules in src/diag_rules.h are tested on the host instead:
;   pio test -e native
; src/ is excluded from this build because main.cpp needs Arduino and the
; MCP2515 library; only the dependency-free header is pulled in via -I src.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -I src -std=c++17 -Wall -Wextra
