[platformio]
default_envs = mkr1000USB

[core]
build_flags = -std=gnu++17

[env:mkr1000USB]
platform = atmelsam
board = mkr1000USB
framework = arduino
monitor_speed = 115200
monitor_filters = default, time, log2file
monitor_dtr = 1
monitor_rts = 1
lib_deps =
  autowp/autowp-mcp2515@^1.3.1
  arduino-libraries/WiFi101@^0.16.1
  elm
lib_ignore = vecu
build_unflags = -std=gnu++11
; C++17 removed `register`, which the Arduino core's CMSIS headers still use.
; Listing them as system headers silences that (GCC ignores the duplicate -I).
build_flags =
  ${core.build_flags}
  -isystem ${platformio.packages_dir}/framework-cmsis/CMSIS/Include
build_src_flags = -Wall -Wextra
build_src_filter = +<firmware/> -<firmware/loopback_demo_hal.cpp>
; The suites under test/ are HOST-ONLY. Without this line, `pio test` also
; targets this environment: it uploads a Unity runner to the board, blocks
; waiting for results over serial, tells you to put the board in reset mode,
; and hangs anyway. Ignoring it here prevents that.
;
; Consequence to be aware of: default_envs above applies to `pio test` as well
; as `pio run`, so a bare `pio test` resolves to this environment, skips every
; suite, and reports "0 test cases" with exit 0. That is a vacuous pass --
; ALWAYS run tests as:
;   pio test -e native
test_ignore = *

[env:mkr1000USB_demo]
extends = env:mkr1000USB
lib_deps =
  autowp/autowp-mcp2515@^1.3.1
  arduino-libraries/WiFi101@^0.16.1
  elm
  vecu
lib_ignore =
build_flags =
  ${env:mkr1000USB.build_flags}
  -DELM_LOOPBACK_DEMO
build_src_filter = +<firmware/>

; src/ is excluded: it needs Arduino (firmware) or POSIX (sim).
[env:native]
platform = native
test_framework = unity
lib_deps =
  elm
  vecu
build_src_filter = -<*>
build_flags = ${core.build_flags} -Wall -Wextra -I test/support

[env:sim]
platform = native
lib_deps =
  elm
  vecu
build_src_filter = +<sim/>
build_flags = ${core.build_flags} -Wall -Wextra
