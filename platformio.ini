[platformio]
; `pio run` builds the adapter firmware only; native exists for `pio test`,
; sim is the host simulator (`pio run -e sim`).
default_envs = mkr1000USB

[core]
build_flags = -std=gnu++17

; The ELM327 adapter: MKR1000 + MKR CAN shield over native USB CDC.
[env:mkr1000USB]
platform = atmelsam
board = mkr1000USB
framework = arduino
monitor_speed = 115200
; timestamp every line, and tee everything to a log file in the project dir
monitor_filters = default, time, log2file
; Belt-and-braces for hosts that gate native-USB CDC output on DTR. Measured
; on this board: output flows with DTR/RTS deasserted, so this is not required.
monitor_dtr = 1
monitor_rts = 1
lib_deps =
  autowp/autowp-mcp2515@^1.3.1
  elm
; The plain adapter never contains the virtual car.
lib_ignore = vecu
build_unflags = -std=gnu++11
; C++17 removed `register`, which the Arduino core's CMSIS headers still use.
; Listing them as system headers silences that (GCC ignores the duplicate -I).
build_flags =
  ${core.build_flags}
  -isystem ${platformio.packages_dir}/framework-cmsis/CMSIS/Include
build_src_flags = -Wall -Wextra
build_src_filter = +<firmware/> -<firmware/loopback_demo_hal.cpp>
; The suites under test/ are HOST-ONLY. Without this line, `pio test` also
; targets this environment: it uploads a Unity runner to the board, blocks
; waiting for results over serial, tells you to put the board in reset mode,
; and hangs anyway. Ignoring it here prevents that.
;
; Consequence to be aware of: default_envs above applies to `pio test` as well
; as `pio run`, so a bare `pio test` resolves to this environment, skips every
; suite, and reports "0 test cases" with exit 0. That is a vacuous pass --
; ALWAYS run tests as:
;   pio test -e native
test_ignore = *

; Bench demo without a car: the virtual Renault answers through the MCP2515
; in loopback mode.
[env:mkr1000USB_demo]
extends = env:mkr1000USB
lib_deps =
  autowp/autowp-mcp2515@^1.3.1
  elm
  vecu
lib_ignore =
build_flags =
  ${env:mkr1000USB.build_flags}
  -DELM_LOOPBACK_DEMO
build_src_filter = +<firmware/>

; Hardware tests are pointless for pure logic and impossible without a car, so
; the core and the virtual car are tested on the host instead:
;   pio test -e native
; src/ is excluded: it needs Arduino (firmware) or POSIX (sim).
[env:native]
platform = native
test_framework = unity
lib_deps =
  elm
  vecu
build_src_filter = -<*>
build_flags = ${core.build_flags} -Wall -Wextra -I test/support

; Host simulator: virtual Renault/Dacia car behind a PTY for real clients.
;   pio run -e sim && .pio/build/sim/program [--link PATH] [--car-bitrate 500|250] [--quiet]
[env:sim]
platform = native
lib_deps =
  elm
  vecu
build_src_filter = +<sim/>
build_flags = ${core.build_flags} -Wall -Wextra
